<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Meting API 测试</title>
    
    <!-- 引入APlayer的CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css">
    <!-- 引入jQuery和APlayer的JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>

    <!-- 常规字重 (400) -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/VanillaNahida/BA-Spark-Cursor/fonts/Blueaka/Blueaka.css">
    <!-- 加粗字重 (700) -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/VanillaNahida/BA-Spark-Cursor/fonts/Blueaka_Bold/Blueaka_Bold.css">
    
    <style>
        /* 将 Blueaka 字体应用于整个网站 */
        * {
            font-family: "Blueaka", sans-serif;
            font-weight: 400; /* 默认使用常规字重 */
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 对于需要加粗的元素，设置正确的字重。由于我们已经链接了对应的字体文件，浏览器会自动匹配。 */
        b, strong, h1, h2, h3, h4, h5, h6, .bold-text {
            font-weight: 700; /* 这会使用 Blueaka 的加粗版本 */
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://img.dkdun.cn/v1/2026/17/2e6fd9b414cb52d0.jpeg') center/cover no-repeat fixed;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        
        .controls button {
            background: linear-gradient(135deg, #00b7ff 0%, #00d4ff 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,183,255,0.3);
        }
        
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,183,255,0.4);
        }
        
        .status {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-label {
            font-weight: 600;
            color: #555;
        }
        
        .status-value {
            color: #00b7ff;
            background: rgba(0,183,255,0.1);
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.4em;
        }
        
        .playlist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .song-item {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            transition: box-shadow 0.2s, transform 0.2s;
            cursor: pointer;
            background: white;
        }
        
        .song-item:hover {
            box-shadow: 0 4px 12px rgba(0,183,255,0.2);
            transform: translateY(-2px);
            border-color: #00b7ff;
        }
        
        .song-cover {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, rgba(0,183,255,0.15) 0%, rgba(0,212,255,0.15) 100%);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            object-fit: cover;
        }
        
        .song-cover svg {
            width: 80px;
            height: 80px;
            opacity: 0.6;
        }
        
        .song-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 1.1em;
        }
        
        .song-artist {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .song-url {
            word-break: break-all;
            font-size: 0.8em;
            color: #00b7ff;
            margin-bottom: 5px;
        }
        
        .lyrics {
            background: rgba(0,183,255,0.05);
            border: 1px solid rgba(0,183,255,0.1);
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            color: #333;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #00b7ff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* APlayer 容器样式 */
        #aplayer-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            z-index: 1000;
        }
        
        .aplayer {
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Custom Meting API 测试</h1>
            <p>测试基于服务器时间的自定义歌单API</p>
        </header>
        
        <div class="controls">
            <button id="refreshBtn">刷新歌单</button>
            <button id="statusBtn">刷新状态</button>
            <button id="clearCacheBtn">清空缓存</button>
        </div>
        
        <div id="status" class="card status">
            <div class="status-item">
                <span class="status-label">服务状态:</span>
                <span class="status-value" id="serviceStatus">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">当前时段:</span>
                <span class="status-value" id="currentPeriod">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">当前时间:</span>
                <span class="status-value" id="currentTime">-</span>
            </div>
        </div>
        
        <div class="card">
            <h2>📋 歌单</h2>
            <div id="playlist" class="playlist">
                <div class="empty"><span class="loading"></span>加载中...</div>
            </div>
        </div>
        
        <div class="card" id="lyricsCard" style="display: none;">
            <h2>📝 歌词</h2>
            <div id="lyrics" class="lyrics"></div>
        </div>
    </div>
    
    <!-- APlayer 播放器容器 -->
    <div id="aplayer-container">
        <div id="aplayer"></div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentPlaylist = [];
        let aplayer = null;
        let serverTimestamp = null;
        let localTimestampAtServerTime = null;
        let timeUpdateInterval = null;
        
        // 获取歌单
        async function fetchPlaylist() {
            const playlistEl = document.getElementById('playlist');
            playlistEl.innerHTML = '<div class="empty"><span class="loading"></span>加载中...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/playlist`);
                const playlist = await response.json();
                
                if (Array.isArray(playlist)) {
                    currentPlaylist = playlist;
                    renderPlaylist(playlist);
                    
                    const period = response.headers.get('X-Period');
                    const currentTime = response.headers.get('X-Current-Time');
                    updateStatus(period, null, currentTime);
                    
                    await initAPlayer(playlist);
                } else {
                    playlistEl.innerHTML = `<div class="empty">❌ 加载失败: 数据格式错误</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                playlistEl.innerHTML = `<div class="empty">❌ 请求失败: ${error.message}</div>`;
            }
        }
        
        // 初始化 APlayer
        async function initAPlayer(songs) {
            // 转换数据格式为 APlayer 所需格式
            const audioList = [];
            
            for (const song of songs) {
                let lrcContent = '';
                
                // 如果有歌词文件路径，尝试加载歌词内容
                if (song.lrc) {
                    try {
                        const response = await fetch(song.lrc);
                        if (response.ok) {
                            lrcContent = await response.text();
                        }
                    } catch (error) {
                        console.warn('加载歌词失败:', error);
                    }
                }
                
                audioList.push({
                    name: song.title,
                    artist: song.author,
                    url: song.url,
                    cover: song.pic || '',
                    lrc: lrcContent
                });
            }
            
            // 如果已存在播放器，销毁它
            if (aplayer) {
                aplayer.destroy();
            }
            
            // 创建新的 APlayer 实例
            aplayer = new APlayer({
                container: document.getElementById('aplayer'),
                theme: '#00b7ff',
                loop: 'all',
                order: 'list',
                preload: 'metadata',
                volume: 0.7,
                lrcType: 1, // 启用歌词显示，1表示使用lrc格式字符串
                mutex: true,
                audio: audioList
            });
        }
        
        // 渲染歌单
        function renderPlaylist(songs) {
            const playlistEl = document.getElementById('playlist');
            
            if (songs.length === 0) {
                playlistEl.innerHTML = '<div class="empty">🎶 暂无歌曲</div>';
                return;
            }
            
            playlistEl.innerHTML = songs.map((song, index) => `
                <div class="song-item" onclick="playSong(${index})">
                    <img src="${song.pic}" alt="" class="song-cover">
                    <div class="song-name">${escapeHtml(song.title)}</div>
                    <div class="song-artist">${escapeHtml(song.author)}</div>
                    <div class="song-url">${escapeHtml(song.url)}</div>
                    ${song.lrc ? '<div style="color: #00b7ff; font-size: 0.85em;">有歌词</div>' : ''}
                </div>
            `).join('');
        }
        
        // 播放歌曲
        async function playSong(index) {
            if (aplayer && currentPlaylist[index]) {
                aplayer.list.switch(index);
                aplayer.play();
                
                // 显示歌词
                const song = currentPlaylist[index];
                if (song.lrc) {
                    try {
                        const response = await fetch(song.lrc);
                        if (response.ok) {
                            const lrcContent = await response.text();
                            document.getElementById('lyricsCard').style.display = 'block';
                            document.getElementById('lyrics').textContent = lrcContent;
                        } else {
                            document.getElementById('lyricsCard').style.display = 'none';
                        }
                    } catch (error) {
                        console.warn('加载歌词失败:', error);
                        document.getElementById('lyricsCard').style.display = 'none';
                    }
                } else {
                    document.getElementById('lyricsCard').style.display = 'none';
                }
            }
        }
        
        // 获取服务状态
        async function fetchStatus() {
            const statusBtn = document.getElementById('statusBtn');
            const originalText = statusBtn.textContent;
            statusBtn.innerHTML = '<span class="loading"></span>获取中...';
            
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                
                document.getElementById('status').classList.remove('hidden');
                document.getElementById('serviceStatus').textContent = data.status;
                // 使用 updateStatus 来统一更新并启动时间定时器
                updateStatus(data.period, null, data.currentTime);
            } catch (error) {
                console.error('Error:', error);
            }
            
            statusBtn.textContent = originalText;
        }
        
        // 清空缓存
        async function clearCache() {
            if (!confirm('确定要清空歌单缓存吗？')) return;
            
            const clearBtn = document.getElementById('clearCacheBtn');
            const originalText = clearBtn.textContent;
            clearBtn.innerHTML = '<span class="loading"></span>清除中...';
            
            try {
                const response = await fetch(`${API_BASE}/refresh`, { method: 'POST' });
                const playlist = await response.json();
                
                if (Array.isArray(playlist)) {
                    alert('缓存已清除！');
                    currentPlaylist = playlist;
                    renderPlaylist(playlist);
                    
                    const period = response.headers.get('X-Period');
                    const currentTime = response.headers.get('X-Current-Time');
                    updateStatus(period, null, currentTime);
                    
                    await initAPlayer(playlist);
                } else {
                    alert('清除失败: 数据格式错误');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('请求失败: ' + error.message);
            }
            
            clearBtn.textContent = originalText;
        }
        
        // 更新状态显示
        function updateStatus(period, folder, time) {
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('currentPeriod').textContent = period;
            
            // 保存服务器时间和对应的本地时间作为基准
            serverTimestamp = new Date(time).getTime();
            localTimestampAtServerTime = Date.now();
            
            // 立即更新显示
            updateCurrentTimeDisplay();
            
            // 启动定时器，每秒更新一次时间
            if (timeUpdateInterval) {
                clearInterval(timeUpdateInterval);
            }
            timeUpdateInterval = setInterval(updateCurrentTimeDisplay, 1000);
        }
        
        // 更新当前时间显示
        function updateCurrentTimeDisplay() {
            if (serverTimestamp && localTimestampAtServerTime) {
                // 根据服务器时间基准计算当前时间
                const elapsed = Date.now() - localTimestampAtServerTime;
                const currentServerTime = new Date(serverTimestamp + elapsed);
                document.getElementById('currentTime').textContent = currentServerTime.toLocaleString();
            }
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 事件绑定
        document.getElementById('refreshBtn').addEventListener('click', fetchPlaylist);
        document.getElementById('statusBtn').addEventListener('click', fetchStatus);
        document.getElementById('clearCacheBtn').addEventListener('click', clearCache);
        
        // 页面加载时自动获取歌单和状态
        fetchPlaylist();
        fetchStatus();
    </script>
</body>
</html>
